# Generated by FDPlight on every publish: edits here are overwritten.
# Pings the FAIR Data Point Index so it harvests this FDP (FDPlight SPEC 7.2).
name: Ping FDP Index
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ping https://fair-testbed.eemcs.utwente.nl/demo-index
        env:
          INDEX_URL: "https://fair-testbed.eemcs.utwente.nl/demo-index"
          ROOT_URL: "https://luizbonino.github.io/synthetic-rkpa-fdp/fdp.ttl"
        run: |
          curl --fail -sS -X POST "$INDEX_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"clientUrl\": \"$ROOT_URL\"}"
